services:
  dashboard:
    image: agent-dashboard:0.3.1
    container_name: agent-dashboard-v0.3.1
    build:
      context: .
    network_mode: host
    restart: unless-stopped
    # Private runtime env (secrets): the same host file Jenkins deploys with,
    # owner 1000:1000, mode 600, in a 700 directory. Never in the repo tree.
    env_file: ${DASHBOARD_ENV_FILE:-/home/motuariki/Documents/DockerVolumes/agent-dashboard/secrets/deploy.env}
    environment:
      PLATFORM_STATUS_DIR: /platform-status
      PCP_ADAPTER_CONFIG_DIR: /pcp-adapters
      HOST: 127.0.0.1
      PORT: "14143"
      OPENCLAW_ACTIVITY_DIR: /var/log/openclaw-activity
      OPENCLAW_CONFIG_FILE: /openclaw-config/openclaw.json
      METRICS_ENCRYPTION_KEY_FILE: /run/secrets/metrics-encryption.key
      METRICS_DATA_DIR: /app/metrics
      # Scene embed (circtime uptime radar build, read-only). A missing host
      # directory becomes an empty mount point, which leaves the route off.
      CIRCTIME_EMBED_DIR: /embed-src/circtime
    volumes:
      - type: bind
        source: ${PLATFORM_STATUS_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/openclaw/deploy/status}
        target: /platform-status
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PCP_ADAPTER_CONFIG_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/pcp/adapters}
        target: /pcp-adapters
        bind:
          create_host_path: false
      # Dashboard state (recordings, scene layouts, panel state, config-editor
      # backups, activity cursors): a host directory owned 1000:1000, mode 700.
      # Until 0.2.6 this was the named volume dashboard_dashboard-state;
      # scripts/deploy.py migrates it once and keeps the volume for rollback.
      - type: bind
        source: ${DASHBOARD_STATE_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/agent-dashboard/state}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${METRICS_DATA_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/agent-dashboard/metrics}
        target: /app/metrics
        bind:
          create_host_path: false
      - type: bind
        source: ${METRICS_KEY_HOST_FILE:-/home/motuariki/Documents/DockerVolumes/agent-dashboard/secrets/metrics-encryption.key}
        target: /run/secrets/metrics-encryption.key
        read_only: true
        bind:
          create_host_path: false
      - ${OPENCLAW_ACTIVITY_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/openclaw/activity}:/var/log/openclaw-activity:ro
      - ${CIRCTIME_EMBED_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/circtime/dist}:/embed-src/circtime:ro
      # Live OpenClaw config: read-write here (admin editor), read-only in OpenClaw.
      - ${OPENCLAW_CONFIG_HOST_DIR:-/home/motuariki/Documents/DockerVolumes/openclaw/config}:/openclaw-config:rw
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:14143/healthz', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
